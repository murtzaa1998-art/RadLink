
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>بوابة المرضى | RadLink</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Tahoma, Arial, sans-serif;
      background: linear-gradient(135deg, #06162c, #103d62);
      color: white;
      display: grid;
      place-items: center;
      padding: 20px;
    }
    .panel {
      width: 100%;
      max-width: 520px;
      padding: 28px;
      background: #102a45;
      border: 1px solid #28739a;
      border-radius: 20px;
    }
    h1 { color: #65d8f5; }
    p { line-height: 1.8; color: #c6dbe9; }
    .item {
      padding: 18px;
      margin-top: 14px;
      border: 1px solid #31688a;
      border-radius: 12px;
      background: #153653;
    }
    a { color: #7de4ff; }
  </style>
</head>
<body>
  <main class="panel">
    <h1>بوابة المرضى</h1>
    <p>أهلاً بك في منصة RadLink للتقارير الشعاعية.</p>

    <section class="item">
      <h3>رفع فحص جديد</h3>
      <p>قريباً: إدخال بيانات المريض ورفع صور الفحص وطلب التقرير.</p>
    </section>

    <section class="item">
      <h3>متابعة تقريري</h3>
      <p>قريباً: متابعة الطلب برقم الموبايل ورمز التحقق أو الباركود.</p>
    </section>

    <p>الدفع الإلكتروني سيتوفر بعد ربط بوابة الدفع.</p>
    <a href="/">العودة إلى الصفحة الرئيسية</a>
  </main>
</body>
</html>
